# Local development only: runs infrastructure services while the application
# runs directly on the host. Do not use this file for production.
services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_DB=pincha
      - POSTGRES_USER=pincha
      - POSTGRES_PASSWORD=local_dev_change_me
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=pincha_local
      - MINIO_ROOT_PASSWORD=local_dev_change_me
    volumes:
      - miniodata:/data

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    restart: unless-stopped
    environment:
      - TOKEN_TTL=3600
      - HTTP_PROXY=http://host.docker.internal:7897
      - HTTPS_PROXY=http://host.docker.internal:7897
    volumes:
      - ./cookies:/cookies:ro
    ports:
      - "127.0.0.1:4416:4416"

volumes:
  pgdata:
  redisdata:
  miniodata:
